<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | PharmaGuard Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="staff-login.css">
</head>
<body>

    <main class="page-wrapper">

        <a href="index.html" class="back-home">
            <span class="back-arrow">&larr;</span>
            Back to Home
        </a>

        <section class="login-card">

            <div class="brand">

                <div class="brand-name">
                    PharmaGuard <span>Pro</span>
                </div>

                <p class="brand-caption">
                    PHARMACY MANAGEMENT SYSTEM
                </p>
            </div>

            <div class="heading">
                <h1>Welcome Back</h1>
                <p>Sign in to access your pharmacy workspace.</p>
            </div>

            <form id="staffLoginForm">

                <div class="form-group">
                    <label for="staffEmail">Staff Email</label>

                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="1.7">
                            <rect x="3" y="5" width="18" height="14"
                                  rx="3"/>
                            <path d="M4 7L12 13L20 7"/>
                        </svg>

                        <input
                            type="email"
                            id="staffEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="off"
                            required
                        >

                        <button type="button" class="clear-email"
                                id="clearEmail"
                                aria-label="Clear email"
                                hidden>&times;</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="staffPassword">Password</label>
                    </div>

                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="1.7">
                            <rect x="4" y="10" width="16" height="11"
                                  rx="2.5"/>
                            <path d="M8 10V7A4 4 0 0 1 16 7V10"/>
                            <path d="M12 14V17"/>
                        </svg>

                        <input
                            type="password"
                            id="staffPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            required
                        >

                        <button type="button" class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                                aria-pressed="false">
                            <svg id="eyeIcon" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.7">
                                <path d="M2 12S5.5 5 12 5S22 12 22 12S18.5 19 12 19S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe"
                               name="remember">
                        <span class="custom-check"></span>
                        Remember me
                    </label>

                    <a href="staff-forgot-password.html"
                       class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    <span>Login to Account</span>
                    <span class="button-arrow">&rarr;</span>
                </button>

                <p id="loginMessage" class="login-message"
                   role="status" aria-live="polite"></p>

            </form>

            <div class="security-note">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <path d="M12 3L20 6V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V6L12 3Z"/>
                    <path d="M9 12L11 14L15 10"/>
                </svg>

                <span>Authorized staff members only</span>
            </div>

        </section>

        <footer class="page-footer">
            &copy; 2026 <span>PharmaGuard Pro</span>.
            All rights reserved.
            <br>
            Secure Pharmacy Management System
        </footer>

    </main>

    <script>
        const form = document.getElementById("staffLoginForm");
        const emailInput = document.getElementById("staffEmail");
        const passwordInput = document.getElementById("staffPassword");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const clearEmail = document.getElementById("clearEmail");
        const rememberMe = document.getElementById("rememberMe");
        const loginMessage = document.getElementById("loginMessage");

        // Show or hide password
        togglePassword.addEventListener("click", function () {
            const show = passwordInput.type === "password";

            passwordInput.type = show ? "text" : "password";

            togglePassword.setAttribute(
                "aria-label", show ? "Hide password" : "Show password"
            );

            togglePassword.setAttribute("aria-pressed", String(show));

            eyeIcon.innerHTML = show
                ? '<path d="M3 3L21 21"/><path d="M10.6 10.6A2 2 0 0 0 13.4 13.4"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5C18.5 5 22 12 22 12A15 15 0 0 1 18.8 16"/><path d="M6.2 6.2C3.5 8.1 2 12 2 12S5.5 19 12 19C13.5 19 14.9 18.6 16.1 18"/>'
                : '<path d="M2 12S5.5 5 12 5S22 12 22 12S18.5 19 12 19S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
        });

        // Clear email
        function updateClearButton() {
            clearEmail.hidden = emailInput.value.length === 0;
        }

        emailInput.addEventListener("input", updateClearButton);

        clearEmail.addEventListener("click", function () {
            emailInput.value = "";
            updateClearButton();
            emailInput.focus();
        });

        // Remember email only when selected
        try {
            const savedEmail = localStorage.getItem(
                "pharmaguard_staff_email"
            );

            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMe.checked = true;
                updateClearButton();
            }
        } catch (error) {
            // Storage may be unavailable.
        }

        // Frontend demonstration only
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!form.reportValidity()) return;

            try {
                if (rememberMe.checked) {
                    localStorage.setItem(
                        "pharmaguard_staff_email",
                        emailInput.value.trim()
                    );
                } else {
                    localStorage.removeItem("pharmaguard_staff_email");
                }
            } catch (error) {
                // Continue if browser storage is unavailable.
            }

            loginMessage.textContent =
                "Staff login is not connected yet. Backend authentication will be added later.";

            loginMessage.className = "login-message info";
        });
    </script>

</body>
</html>
